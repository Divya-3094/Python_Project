<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce | Home</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        body {
            background: #f7f7f7;
            font-family: 'Poppins', sans-serif;
        }

        /* Banner */
        .hero {
            background: url('https://images.unsplash.com/photo-1542831371-d531d36971e6') center/cover no-repeat;
            height: 400px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 700;
        }

        .hero p {
            font-size: 20px;
        }

        /* Product Cards */
        .product-card {
            border-radius: 15px;
            transition: 0.3s;
            box-shadow: 0px 3px 10px rgba(0,0,0,0.1);
        }

        .product-card:hover {
            transform: scale(1.04);
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
        }

        .product-card img {
            border-radius: 15px 15px 0 0;
        }

        .btn-add {
            background: #ff4d4d;
            color: white;
            border-radius: 25px;
            padding: 8px 20px;
        }

        .btn-add:hover {
            background: #e60000;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">MyShop</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto gap-3">
                <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Cart</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Banner / Hero Section -->
<div class="hero">
    <div class="text-center">
        <h1>Welcome to MyShop</h1>
        <p>Best Deals • Fast Delivery • Quality Products</p>
        <a href="#" class="btn btn-primary px-4 py-2 mt-3">Shop Now</a>
    </div>
</div>

<!-- Product Section -->
<div class="container my-5">
    <h2 class="text-center mb-4 fw-bold">Trending Products</h2>

    <div class="row g-4">

        <!-- Product 1 -->
        <div class="col-md-3">
            <div class="card product-card">
                <img src="https://m.media-amazon.com/images/I/61aUBxqc5PL._SL1500_.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5 class="card-title">Wireless Headphones</h5>
                    <p class="text-muted">₹1,499</p>
                    <a href="#" class="btn btn-add">Add to Cart</a>
                </div>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="col-md-3">
            <div class="card product-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDrD39r4bk9FUfZWs4NAeONKgAsVDivrytOg&s" class="card-img-top">
                <div class="card-body text-center">
                    <h5 class="card-title">Smart Watch</h5>
                    <p class="text-muted">₹2,299</p>
                    <a href="#" class="btn btn-add">Add to Cart</a>
                </div>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="col-md-3">
            <div class="card product-card">
                <img src="https://static.nike.com/a/images/t_default/fa167834-731f-47d5-bdc3-8578415c02df/custom-nike-air-max-97-shoes-by-you.png" class="card-img-top">
                <div class="card-body text-center">
                    <h5 class="card-title">Nike Running Shoes</h5>
                    <p class="text-muted">₹3,899</p>
                    <a href="#" class="btn btn-add">Add to Cart</a>
                </div>
            </div>
        </div>

        <!-- Product 4 -->
        <div class="col-md-3">
            <div class="card product-card">
                <img src="https://www.fgear.in/cdn/shop/files/1_06a8d208-f39b-464a-b31b-1ffb172fc1d5.png?v=1759921010&width=1946" class="card-img-top">
                <div class="card-body text-center">
                    <h5 class="card-title">Laptop Backpack</h5>
                    <p class="text-muted">₹899</p>
                    <a href="#" class="btn btn-add">Add to Cart</a>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
