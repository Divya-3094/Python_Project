<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} - Product Details</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .product-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 10px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            color: #0d6efd;
        }

        .description {
            font-size: 16px;
            color: #444;
        }

        .add-cart-btn {
            background-color: #0d6efd;
            color: white;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
        }
        .add-cart-btn:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>

<!-- NAVBAR (optional include your own) -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">MyShop</a>
    </div>
</nav>

<!-- PRODUCT DETAIL CONTENT -->
<div class="container mt-5">
    <div class="row">
        <!-- IMAGE -->
        <div class="col-md-6">
            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="product-image shadow">
        </div>

        <!-- DETAILS -->
        <div class="col-md-6">
            <h2>{{ product.name }}</h2>

            <p class="price">₹ {{ product.price }}</p>

            <p class="description">
                {{ product.description }}
            </p>

            <!-- Add to Cart Button -->
            <form action="{% url 'add_to_cart' product.id %}" method="POST">
                {% csrf_token %}
                <button type="submit" class="add-cart-btn">Add to Cart</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
